<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pastor Ezequias</title>
    
    <meta name="description" content="Pastor Ezequias - Deputado Estadual." />
    
    <!-- PWA & Mobile Web App Settings -->
    <link rel="icon" type="image/svg+xml" href="/agenda-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1b3e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agenda Ezequias" />
    <meta name="msapplication-starturl" content="/?page=agenda" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/agenda-icon-192.png" />
    
    <script>
      // Preserva o contexto da rota acessada para o modo standalone (PWA instalado).
      // Salva e restaura a rota ativa sem desviar o usuário para telas indesejadas (ex: login da Agenda quando em /tp).
      (function() {
        try {
          var p = (window.location.pathname || '').toLowerCase().trim().replace(/\/+/g, '/');
          var isRoot = p === '/' || p === '' || p === '/index.html' || p === '/index.html/';
          var cleanHash = (window.location.hash || '').toLowerCase().replace(/^#[!/]*\/?/, '').replace(/\/+$/, '').split('?')[0].trim();
          var params = new URLSearchParams(window.location.search);
          var pageParam = (params.get('page') || params.get('route') || params.get('p') || '').trim().toLowerCase();

          // Identifica se a rota atual corresponde explicitamente ao Teleprompter
          var isTpRoute = p === '/tp' || p.indexOf('/tp/') === 0 || p === '/ppt' || p.indexOf('/ppt/') === 0 ||
                          p === '/prompter' || p.indexOf('/prompter/') === 0 || p === '/teleprompter' || p.indexOf('/teleprompter/') === 0 ||
                          cleanHash === 'tp' || cleanHash === 'ppt' || cleanHash === 'prompter' || cleanHash === 'teleprompter' ||
                          pageParam === 'tp' || pageParam === 'ppt' || pageParam === 'prompter' || pageParam === 'teleprompter';

          // Salva no localStorage a última rota intencional para restauração no PWA standalone
          if (isTpRoute) {
            try { localStorage.setItem('pwa_last_active_route', 'ppt'); } catch(e) {}
          } else if (pageParam === 'agenda' || p === '/agenda' || cleanHash === 'agenda') {
            try { localStorage.setItem('pwa_last_active_route', 'agenda'); } catch(e) {}
          }

          var isStandalone = (typeof window !== 'undefined') && (
            (window.matchMedia && (
              window.matchMedia('(display-mode: standalone)').matches ||
              window.matchMedia('(display-mode: fullscreen)').matches ||
              window.matchMedia('(display-mode: minimal-ui)').matches
            )) ||
            (window.navigator && window.navigator.standalone === true) ||
            (typeof document !== 'undefined' && typeof document.referrer === 'string' && document.referrer.indexOf('android-app://') === 0)
          );

          // Se estiver em modo standalone e na raiz sem rota explícita na URL, restaura a última rota do usuário
          if (isStandalone && isRoot && !cleanHash && !pageParam) {
            var savedRoute = 'agenda';
            try { savedRoute = localStorage.getItem('pwa_last_active_route') || 'agenda'; } catch(e) {}

            if (savedRoute === 'ppt') {
              window.history.replaceState(null, '', '/tp');
            } else if (savedRoute === 'agenda') {
              params.set('page', 'agenda');
              var newSearch = params.toString();
              window.history.replaceState(null, '', newSearch ? '/?' + newSearch : '/?page=agenda');
            }
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Open Graph / WhatsApp / Facebook Preview Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pastor Ezequias" />
    <meta property="og:description" content="Pastor Ezequias - Deputado Estadual" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
